<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Gallery</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background-color: #f2f4f8;
      color: #1c1c1c;
    }

    main {
      width: 100%;
      max-width: 480px;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 32px 24px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    p {
      margin: 0 0 24px;
      color: #555;
    }

    .button {
      display: block;
      margin: 12px 0;
      padding: 14px 18px;
      background-color: #0b2265;
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 6px;
    }

    .button:hover {
      background-color: #a71930;
    }
  </style>
</head>
<body>
  <main>
    <h1>Project Gallery</h1>
    <p>Choose a project to view.</p>

    <a class="button" href="midterm-site/">Midterm Project</a>

    <!-- Change "suny-website/" to the name of the folder your SUNY site is in -->
    <a class="button" href="suny-website/">SUNY Website</a>
  </main>
</body>
</html>
